<div class="error-page d-flex align-items-center justify-content-center">
  <div class="error-container text-center p-4">
    <h1 class="error-code mb-0"><i class="fa-solid fa-circle-exclamation"></i></h1>
    <h2 class="display-6 error-message mb-3">Acceso Denegado</h2>
    <p class="lead error-message mb-5">No tienes los permisos necesarios para acceder a esta sección.</p>
    <div class="d-flex justify-content-center gap-3">
      <a (click)="regresar()" class="btn btn-glass px-4 py-2">Regresar</a>
      <a (click)="Salir()" class="btn btn-glass px-4 py-2">Salir</a>
    </div>
  </div>
</div>
