<div class="inicio-card input-group flex-nowrap">
  <span class="input-group-text" id="addon-wrapping"><i class="fa-solid fa-magnifying-glass"></i></span>
  <input #inputMaterial matInput placeholder="Buscar" class="form-control bg-dark text-white mb-2"
    (keyup)="applyFilter($event)" autofocus>

  <app-export-button [action]="export.bind(this)" color="success" [outline]="true"
    extraClass="me-2"></app-export-button>
</div>

<div class="container-scroll">
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="bitacoraCargaId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.bitacoraCargaId }}</td>
      </ng-container>

      <ng-container matColumnDef="tabla">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tabla</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.tabla }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.usuario }}</td>
      </ng-container>

      <ng-container matColumnDef="modificado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Modificado</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.modificado | date: 'dd / MMMM / yyyy h:mm:ss a' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="proceso">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Proceso</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.proceso }}</td>
      </ng-container>

      <ng-container matColumnDef="registroId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Registro</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.registroId }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <p *ngIf="dataSource.data.length === 0" class="text-center">No hay cargas registrados.</p>
  </div>
</div>
<div class="paginator-container">
  <mat-paginator [pageSize]="pageSize"></mat-paginator>
</div>
