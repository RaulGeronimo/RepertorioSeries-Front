<div class="inicio-card input-group flex-nowrap">
  <span class="input-group-text" id="addon-wrapping"><i class="fa-solid fa-magnifying-glass"></i></span>
  <input #inputMaterial matInput placeholder="Buscar" class="form-control bg-dark text-white mb-2"
    (keyup)="applyFilter($event)" autofocus>

  <app-export-button [action]="export.bind(this)" color="success" [outline]="true"
    extraClass="me-2"></app-export-button>
</div>


<div class="container-scroll">
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="bitacoraErrorId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.bitacoraErrorId }}</td>
      </ng-container>

      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.usuario }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.fecha | date: 'dd / MMMM / yyyy h:mm:ss a' }}</td>
      </ng-container>

      <ng-container matColumnDef="tabla">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tabla</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.tabla }}</td>
      </ng-container>

      <ng-container matColumnDef="columna">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Columna</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.columna }}</td>
      </ng-container>

      <ng-container matColumnDef="mensaje">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Mensaje Error</th>
        <td mat-cell *matCellDef="let bitacora">{{ bitacora.mensaje }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <p *ngIf="dataSource.data.length === 0" class="text-center">No hay errores registrados.</p>
  </div>
</div>
<div class="paginator-container">
  <mat-paginator [pageSize]="pageSize"></mat-paginator>
</div>
